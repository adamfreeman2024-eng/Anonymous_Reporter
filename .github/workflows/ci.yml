name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (backend)
        run: npm run typecheck -w backend

      - name: Lint (frontend)
        run: npm run lint -w frontend

      - name: Lint (backend)
        run: npm run lint -w backend

      - name: Unit tests
        run: npm run test

      - name: Coverage gate (backend ≥ 60%)
        run: npm run test:coverage -w backend
        # B-6 (2026-08-09): coverage is a blocking gate, not informational.
        # Thresholds configured in backend/vitest.config.ts (lines/functions/
        # branches/statements ≥ 60/50/60/60). Current: ~71% all-files.

      - name: Build (backend)
        run: npm run build -w backend

      - name: Build (frontend)
        run: npm run build -w frontend
        continue-on-error: true

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (critical blocks, high warns)
        run: |
          npm audit --audit-level=critical || exit 1
          npm audit --audit-level=high || echo "::warning::HIGH vulns present — see Watch List (transitive @hashgraph/sdk elliptic/image-size, no fix yet)"
        # B-6: CRITICAL blocks CI; HIGH is reported but non-blocking because the
        # remaining HIGHs are transitive via @hashgraph/sdk (elliptic, image-size)
        # with no available fix — tracked in STATE.md Watch List.
