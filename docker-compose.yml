services:
  # ── MinIO S3-compatible object storage ──
  minio:
    image: minio/minio:RELEASE.2025-06-20T04-31-41Z
    container_name: ar-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anonymous_reporter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── SimpleX SMP Relay (self-hosted, zero identifiers) ──
  smp-relay:
    image: simplexchat/smp-server:latest
    container_name: ar-smp-relay
    ports:
      - "${SMP_PORT:-5223}:5223"
    volumes:
      - smp_data:/etc/opt/simplex
      - smp_logs:/var/opt/simplex
    environment:
      ADDR: ${SMP_ADDR:-localhost}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "smp-server", "status"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Bucket provisioning + lifecycle policy (one-shot) ──
  minio-init:
    image: minio/mc:latest
    container_name: ar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-reports};
      mc anonymous set private local/$${MINIO_BUCKET:-reports};
      mc ilm import local/$${MINIO_BUCKET:-reports} < /lifecycle.json;
      echo "[minio-init] Bucket + lifecycle policy configured.";
      '
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anonymous_reporter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-reports}
    volumes:
      - ./docker/minio-lifecycle.json:/lifecycle.json:ro

  # ── Backend (blind proxy) ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ar-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HEDERA_NETWORK: ${HEDERA_NETWORK:-testnet}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-16}
      HEDERA_ACCOUNT_ID: ${HEDERA_ACCOUNT_ID:-}
      HEDERA_PRIVATE_KEY: ${HEDERA_PRIVATE_KEY:-}
      HEDERA_TOPIC_ID: ${HEDERA_TOPIC_ID:-}
      # ⚠️ LE_PRIVATE_KEY_PEM must NEVER be set on the blind proxy in
      # production — the proxy never decrypts. Internal-network decryption
      # runs on an isolated host with its own key material.
      INTERNAL_NETWORK_URL: ${INTERNAL_NETWORK_URL:-}
      ENABLE_INTERNAL_MOCK: ${ENABLE_INTERNAL_MOCK:-0}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-anonymous_reporter}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-reports}
      AUDIT_LOG_PATH: /app/data/audit.jsonl
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: ar-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  minio_data:
  smp_data:
  smp_logs:
  backend_data:
